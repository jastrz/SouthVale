services:
  postgres:
    image: postgres:latest
    container_name: townmanager-db
    environment:
      POSTGRES_DB: townmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: houkiii/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: townmanager-backend
    ports:
      - "5147:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=townmanager;Username=postgres;Password=postgres"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: townmanager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
