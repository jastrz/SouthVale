services:
  postgres:
    image: postgres:alpine
    container_name: townmanager-db
# uncomment for local dev, or use docker-compose.override.yml
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-townmanager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: houkiii/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: townmanager-backend
    ports:
      - "5147:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-townmanager};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:3000}
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${Jwt__Key}
      LlmPlayer__ApiUrl: ${LlmPlayer__ApiUrl:-}
      LlmPlayer__ApiKey: ${LlmPlayer__ApiKey:-}
      LlmPlayer__Model: ${LlmPlayer__Model:-}
      Barbarian__TickIntervalCron: ${Barbarian__TickIntervalCron:-*/10 * * * *}
      LlmPlayer__TickIntervalCron: ${LlmPlayer__TickIntervalCron:-*/15 * * * *}
      Features__UseBarbarians: ${Features__UseBarbarians:-true}
      Features__UseLlmPlayers: ${Features__UseLlmPlayers:-false}
      Admin__Password: ${Admin__Password:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/TownManager.Api/logs:/app/logs
    restart: unless-stopped

  client:
    image: houkiii/client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: townmanager-client
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: townmanager-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-townmanager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-0}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-0}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: townmanager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
