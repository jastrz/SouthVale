server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # OpenAPI spec fetch (Scalar computes URL relative to its own path)
    location ~ ^/southvale/api/scalar/openapi(/.*)?$ {
        rewrite ^/southvale/api/scalar/openapi(/.*)$ /openapi$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenAPI spec also reachable without the /scalar/ segment
    location ~ ^/southvale/api/openapi(/.*)?$ {
        rewrite ^/southvale/api/openapi(/.*)$ /openapi$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API / auth / SignalR / scalar -> backend (strip /southvale/api prefix)
    location ~ ^/southvale/api/(auth|gameplay|config|admin|health|hubs|scalar)(/.*)?$ {
        rewrite ^/southvale/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location = /southvale {
        return 301 /southvale/;
    }
    location /southvale/ {
        rewrite ^/southvale/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
