name: Tests

on:
  push:
    branches: [master]
    paths-ignore: ['client/**', '**.md']
  pull_request:
    paths-ignore: ['client/**', '**.md']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Test
        run: dotnet test backend/TownManager.slnx
